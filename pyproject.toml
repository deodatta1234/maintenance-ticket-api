[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-maintenance-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

